name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "desktop/**"
      - "index.html"
      - "*.js"
      - "*.css"
      - "manifest.json"
      - "icon.svg"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Package complete source code
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "NovaBlu-ERP-0.14-Source"
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @("node_modules","dist",".git")
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $src -Recurse -Force
          }
          $zip = Join-Path $PWD "dist\NovaBlu-ERP-0.14-Source.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zip -CompressionLevel Optimal

      - name: Build checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in @(".exe",".zip") } | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)" | Out-File -FilePath "dist\SHA256SUMS.txt" -Append -Encoding ascii
          }

      - name: Upload Windows app and source
        uses: actions/upload-artifact@v4
        with:
          name: NovaBlu-ERP-0.14-Windows-and-Source
          path: |
            dist/NovaBlu-ERP-0.14-Setup-x64.exe
            dist/NovaBlu-ERP-0.14-Source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
