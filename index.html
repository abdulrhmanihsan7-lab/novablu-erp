/* NovaBlu ERP 0.02 — Modern UI layer */
.nb-icon{display:block;flex:0 0 auto}
.topbar{height:70px;padding:10px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(226,232,240,.9);gap:10px}
.content{margin-right:268px}
.sidebar{width:268px;padding:16px 12px 92px;background:linear-gradient(180deg,#0b1220 0%,#0d172a 58%,#07101f 100%)}
.brand{padding:5px 8px 18px;margin-bottom:7px}
.brand .mark{width:42px;height:42px;border-radius:14px}
.brand h1{font-size:18px;letter-spacing:-.2px}
.brand small{display:inline-flex;margin-top:3px;padding:2px 7px;border-radius:999px;background:rgba(59,130,246,.12);color:#93c5fd;font-size:10px}
.nav-group{margin:9px 0 13px}
.nav-label{text-transform:none;letter-spacing:0;padding:8px 11px 5px;color:#64748b;font-weight:700}
.nav-btn{min-height:43px;padding:9px 11px;border-radius:13px;gap:11px;font-weight:650;transition:.18s ease}
.nav-btn .ico{width:22px;height:22px;display:grid;place-items:center;color:#94a3b8}
.nav-btn:hover{background:rgba(30,41,59,.78);transform:translateX(-1px)}
.nav-btn:hover .ico,.nav-btn.active .ico{color:#fff}
.nav-btn.active{background:linear-gradient(90deg,#1d4ed8,#2563eb);box-shadow:0 9px 22px rgba(37,99,235,.22)}
.sidebar-account{position:absolute;bottom:14px;right:12px;left:12px;border:1px solid rgba(148,163,184,.13);background:rgba(15,23,42,.76);color:#e2e8f0;border-radius:16px;min-height:58px;padding:9px 10px;display:flex;align-items:center;gap:9px;text-align:right}
.sidebar-account:hover,.sidebar-account.active{background:#14213a;border-color:rgba(96,165,250,.32)}
.account-copy{display:flex;flex-direction:column;min-width:0;flex:1}
.account-copy strong{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-copy small{color:#94a3b8;font-size:10.5px;margin-top:2px}
.avatar-sm,.avatar-lg,.avatar-xl{display:grid;place-items:center;border-radius:50%;font-weight:850;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1d4ed8;border:1px solid #bfdbfe;flex:0 0 auto}
.avatar-sm{width:34px;height:34px;font-size:11px}.avatar-lg{width:48px;height:48px;font-size:15px}.avatar-xl{width:76px;height:76px;font-size:24px;box-shadow:0 8px 25px rgba(37,99,235,.12)}
.profile-chip{height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 8px 4px 6px;display:flex;align-items:center;gap:8px;color:var(--ink);min-width:144px}
.profile-chip:hover{border-color:#cbd5e1;background:#f8fafc}
.profile-text{display:flex;flex-direction:column;min-width:0;text-align:right;flex:1}
.profile-text strong{font-size:12px;max-width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-text small{font-size:10px;color:var(--muted);margin-top:1px}
.notif-modern{position:relative}
.notif-dot{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;border-radius:999px;background:#dc2626;color:#fff;font-size:9px;font-weight:800;border:2px solid #fff}
.account-popover{position:fixed;top:65px;left:18px;width:290px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(15,23,42,.16);padding:10px;z-index:90}
.account-popover button{width:100%;border:0;background:transparent;border-radius:11px;padding:10px 11px;display:flex;align-items:center;gap:10px;color:var(--ink);text-align:right}
.account-popover button:hover{background:#f8fafc}
.popover-user{display:flex;align-items:center;gap:11px;padding:8px}
.popover-user>div{display:flex;flex-direction:column;min-width:0}
.popover-user strong{font-size:13px}.popover-user small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.popover-sep{height:1px;background:var(--line);margin:7px 2px}
.searchbar{height:44px;border-radius:14px;background:#f8fafc;border-color:#e2e8f0}
.searchbar:focus-within{background:#fff;border-color:#93c5fd;box-shadow:0 0 0 4px rgba(59,130,246,.08)}
.searchbar span{display:grid;place-items:center}
.select-mini,.icon-btn{height:44px;border-radius:13px}
.card{border-radius:20px;box-shadow:0 8px 25px rgba(15,23,42,.045)}
.btn{border-radius:12px;min-height:39px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.16s ease}
.btn:hover{transform:translateY(-1px)}
.page-head{margin-bottom:17px}
.page-head h2{letter-spacing:-.35px}
.quick-menu{border-radius:18px;padding:8px;min-width:220px;box-shadow:0 18px 50px rgba(15,23,42,.17);border:1px solid var(--line)}
.quick-menu button{display:flex;align-items:center;gap:9px;border-radius:11px}
.quick{box-shadow:0 14px 34px rgba(37,99,235,.35)}
.account-hero{display:flex;align-items:center;gap:16px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#fff 30%,#f8fbff 100%)}
.account-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.account-name-row h3{margin:0;font-size:22px}
.account-actions{display:flex;gap:8px;flex-wrap:wrap}
.density-compact .card{padding:12px}.density-compact td,.density-compact th{padding-top:8px;padding-bottom:8px}.density-compact .stat-row{padding-top:8px;padding-bottom:8px}
.mobile-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mobile-nav button .nb-icon{margin:auto}
.mobile-nav .center span{display:grid;place-items:center}
.mobile-nav .center .nb-icon{color:#fff}
@media(max-width:800px){
 .content{margin-right:0}
 .topbar{height:62px;padding:8px 10px;gap:7px}
 .profile-chip{min-width:auto;width:42px;height:42px;padding:3px;border:0;background:transparent}
 .profile-chip .profile-text,.profile-chip>.nb-icon{display:none}
 .profile-chip .avatar-sm{width:38px;height:38px}
 .account-popover{top:58px;left:10px;right:10px;width:auto}
 .sidebar{width:min(86vw,300px);padding-bottom:92px}
 .sidebar-account{position:sticky;bottom:0;margin-top:12px;right:auto;left:auto}
 .mobile-nav{right:8px;left:8px;bottom:8px;height:62px;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(15,23,42,.14);overflow:visible}
 .mobile-nav button{border-radius:14px;background:transparent}
 .mobile-nav .center{max-width:68px}
 .mobile-nav .center span{width:50px;height:50px;border-radius:17px;margin:-17px auto 0}
 .account-hero{align-items:flex-start;flex-wrap:wrap}
 .account-hero .avatar-xl{width:62px;height:62px;font-size:20px}
 .account-hero>.btn{width:100%}
 .account-name-row h3{font-size:19px}
}

function viewDashboard(){const inv=db.invoices.filter(i=>i.companyId===db.session.companyId&&!i.deletedAt&&['confirmed','partial','paid'].includes(i.status));const sales=inv.reduce((s,i)=>s+invTotals(i).total,0),due=inv.reduce((s,i)=>s+invTotals(i).due,0),exp=db.expenses.filter(e=>e.companyId===db.session.companyId&&e.status==='paid').reduce((s,e)=>s+Number(e.amount||0),0);const low=db.products.filter(p=>p.companyId===db.session.companyId&&p.trackStock&&stock(p.id)<=Number(p.reorder||0));const months=[];for(let k=5;k>=0;k--){let dt=new Date();dt.setMonth(dt.getMonth()-k);let key=dt.toISOString().slice(0,7);let val=inv.filter(i=>(i.date||'').startsWith(key)).reduce((s,i)=>s+invTotals(i).total,0);months.push({key,label:dt.toLocaleDateString('ar-IQ',{month:'short'}),val})}const max=Math.max(...months.map(x=>x.val),1);return pageHead('لوحة التحكم',`${company().name} • ${branch()?.name||''}`,`<button class="btn primary" data-q="invoice">＋ فاتورة</button>`)+`<div class="grid kpis"><div class="kpi"><div class="bubble">${icon("reports",18)}</div><div class="lab">إجمالي المبيعات</div><div class="val">${fmt(sales)}</div><div class="trend" style="color:var(--green)">من ${inv.length} فاتورة فعّالة</div></div><div class="kpi"><div class="bubble">${icon("sales",18)}</div><div class="lab">الفواتير</div><div class="val">${inv.length}</div><div class="trend">${inv.filter(i=>invTotals(i).due>0).length} تحتاج متابعة</div></div><div class="kpi"><div class="bubble">${icon("expenses",18)}</div><div class="lab">المصروفات المدفوعة</div><div class="val">${fmt(exp)}</div><div class="trend">تشغيلي</div></div><div class="kpi"><div class="bubble">${icon("cash",18)}</div><div class="lab">مستحقات العملاء</div><div class="val">${fmt(due)}</div><div class="trend" style="color:var(--amber)">${low.length} تنبيه مخزون</div></div></div><div class="grid cards2"><div class="card"><div class="card-head"><h3>المبيعات — آخر 6 أشهر</h3><div class="grow"></div></div><div class="bar-chart">${months.map(x=>`<di Case().includes(q)),emp=(db.employees||[]).find(x=>(x.name+' '+x.jobTitle+' '+x.phone).toLowerCase().includes(q));if(i)quick('invoice',i.id);else if(p)quick('product',p.id);else if(cst)quick('customer',cst.id);else if(sup)quick('supplier',sup.id);else if(po)quick('purchase',po.id);else if(lead)quick('lead',lead.id);else if(emp)quick('employee',emp.id);else toast('لا توجد نتيجة مطابقة')}};if(route==='sales'){wireSales();NBADV.wireInvoiceExtras(advancedCtx())};if(route==='quotes')NBADV.wireQuoteWorkflow(advancedCtx());if(route==='pos')NBRELEASE.wirePOS(advancedCtx());if(route==='products')NBRELEASE.wireProducts(advancedCtx());if(route==='customers'||route==='suppliers')wireContacts();if(route==='inventory')NBRELEASE.wireInventory(advancedCtx());if(route==='purchasing'){$$('[data-po]').forEach(b=>b.onclick=()=>quick('purchase',b.dataset.po));NBRELEASE.wirePurchasing(advancedCtx())};if(route==='expenses')wireExpenses();if(route==='cash')wireCash();if(route==='accounting')NBRELEASE.wireAccounting(advancedCtx());if(route==='documents')NBRELEASE.wireDocuments(advancedCtx());if(route==='reports'){wireReports();NBADV.wireReportExtras(advancedCtx())};if(route==='workflows')NBADV.wireWorkflows(advancedCtx());if(route==='automation')NBSAAS.wireAutomation(advancedCtx());if(route==='payroll')NBADV.wirePayroll(advancedCtx());if(route==='integrations')NBSAAS.wireIntegrations(advancedCtx());if(route==='owner')NBACT.wireOwner(advancedCtx());if(route==='assistant')NBSAAS.wireAssistant(advancedCtx());if(route==='subscription')NBSAAS.wireSubscription(advancedCtx());if(route==='launch')NBACT.wireLaunch(advancedCtx());if(route==='support')NBSAAS.wireSupport(advancedCtx());if(route==='health')NBREL.wireHealth(advancedCtx());if(route==='device')NBMOBILE.wireDevice(advancedCtx());if(route==='rcqa')NBRC.wire(advancedCtx());if(route==='experience')NBFINALUX.wire(advancedCtx());if(route==='security')NBADV.wireSecurity(advancedCtx());if(route==='qa')NBRELEASE.wireQA(advancedCtx());if(route==='account')wireAccount();if(route==='users')wireUsers();if(route==='org')wireOrg();if(route==='notifications'){$('#readAll').onclick=()=>{db.notifications.forEach(n=>n.read=true);audit('قراءة الإشعارات','Notifications');save();render()}}if(route==='activity')wireActivity();if(route==='settings')wireSettings();if(route==='data')NBRELEASE.wireData(advancedCtx());if(route==='trash')wireTrash();$$('[data-product]').forEach(b=>b.onclick=()=>quick('product',b.dataset.product));$$('[data-contact]').forEach(b=>b.onclick=()=>quick(b.dataset.kind==='customers'?'customer':'supplier',b.dataset.contact));$$('[data-invoice]').forEach(b=>b.onclick=()=>quick('invoice',b.dataset.invoice));if(window.NBPRO)NBPRO.wire(proCtx(),route);if(route==='quotes'&&window.NBADV)NBADV.wireQuoteWorkflow(advancedCtx());if(window.NBUX)NBUX.postRender(advancedCtx(),route);if(window.NBSAAS)NBSAAS.postRender(advancedCtx(),route);if(window.NBACT)NBACT.postRender(advancedCtx(),route);if(window.NBREL)NBREL.postRender(advancedCtx(),route);if(window.NBMOBILE)NBMOBILE.postRender(advancedCtx(),route);if(window.NBFINALUX)NBFINALUX.postRender(advancedCtx(),route)}

function wireStockForm(){const f=$('#stockForm');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),pid=fd.get('productId'),type=fd.get('type'),qty=Number(fd.get('qty')),p=db.products.find(x=>x.id===pid);if(db.settings.preventNegativeStock&&['delivery','out','return_supplier'].includes(type)&&stock(pid)<qty){toast('لا يمكن جعل المخزون سالباً');return}db.stockMoves.push({id:uid('sm'),companyId:db.session.companyId,warehouseId:warehouse()?.id||'',productId:pid,type,qty,date:fd.get('date'),ref:fd.get('ref'),note:fd.get('note')});audit('حركة مخزون','Stock',`${p?.nameAr} ${type} ${qty}`);if(stock(pid)<=p.reorder)notify('مخزون منخفض',`${p.nameAr}: المتاح ${stock(pid)}`,'stock');save('تم تسجيل الحركة');closeModal();render()}}

function wireExpenses(){$$('[data-del-exp]').forEach(b=>b.onclick=()=>{if(!can('expenses','delete')){toast('لا توجد صلاحية حذف مصروف');return}const e=db.expenses.find(x=>x.id===b.dataset.delExp);if(!e)return;if(window.NBADV&&!NBADV.guardFinancialEdit(advancedCtx(),e))return;if(!confirm('حذف المصروف؟'))return;if(e.status==='paid'){toast('لا يمكن حذف مصروف مدفوع مباشرة. استخدم قيد تصحيح أو أعده للمراجعة');return}db.expenses=db.expenses.filter(x=>x.id!==b.dataset.delExp);if(window.NBADV)NBADV.recordChange(advancedCtx(),'Expense',e.id,e,null,'حذف');save('تم الحذف');render()})}
function wireExpenseForm(){const f=$('#expenseForm');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),obj={id:uid('e'),companyId:db.session.companyId,branchId:db.session.branchId,date:fd.get('date'),category:fd.get('category'),amount:Number(fd.get('amount')),accountId:fd.get('accountId'),status:fd.get('status'),notes:fd.get('notes'),createdAt:now()};if(window.NBADV&&!NBADV.guardFinancialEdit(advancedCtx(),obj))return;const limit=Number(db.security?.approvalLimit||0),privileged=['Owner','Admin','Manager'].includes(currentUser().role);if(obj.status==='paid'&&limit>0&&obj.amount>limit&&!privileged){obj.status='draft';db.approvals.unshift({id:uid('ap'),companyId:db.session.companyId,type:'مصروف',title:'اعتماد مصروف '+obj.category,requester:currentUser().name,amount:obj.amount,status:'pending',refType:'expense',refId:obj.id,createdAt:now()});notify('موافقة مطلوبة','مصروف '+obj.category,'approval')}db.expenses.push(obj);if(obj.status==='paid')db.cashTransactions.push({id:uid('ct'),companyId:obj.companyId,accountId:obj.accountId,date:obj.date,type:'out',amount:obj.amount,ref:'EXP-'+obj.id,note:obj.category,createdAt:now()});if(window.NBADV)NBADV.recordChange(advancedCtx(),'Expense',obj.id,null,obj,'إنشاء');audit('إضافة مصروف','Expense',obj.category);save(obj.status==='draft'&&limit>0&&obj.amount>limit&&!privileged?'تم إرسال المصروف للموافقة':'تم حفظ المصروف');closeModal();render()}}
function wireCash(){const b=$('#newCashTx');if(!b)return;if(!can('cash','create')){b.remove();return}b.onclick=()=>openModal('حركة مالية',cashForm(),false)}
function wireCashForm(){const f=$('#cashForm');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),obj={id:uid('ct'),companyId:db.session.companyId,accountId:fd.get('accountId'),date:fd.get('date'),type:fd.get('type'),amount:Number(fd.get('amount')),ref:fd.get('ref'),note:fd.get('note'),createdAt:now()};if(window.NBADV&&!NBADV.guardFinancialEdit(advancedCtx(),obj))return;db.cashTransactions.push(obj);if(window.NBADV)NBADV.recordChange(advancedCtx(),'Cash',obj.id,null,obj,'إنشاء');audit('حركة مالية','Cash',fd.get('ref')||'');save('تم تسجيل الحركة');closeModal();render()}}
function wireAccounting(){const b=$('#newJournal');if(!b)return;if(!can('accounting','create')){b.remove();return}b.onclick=()=>openModal('قيد يومية',journalForm(),false)}
function wireJournalForm(){const f=$('#journalForm');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),lines=[{accountId:fd.get('a1'),debit:Number(fd.get('d1')||0),credit:Number(fd.get('c1')||0)},{accountId:fd.get('a2'),debit:Number(fd.get('d2')||0),credit:Number(fd.get('c2')||0)}],d=lines.reduce((s,l)=>s+l.debit,0),c=lines.reduce((s,l)=>s+l.credit,0),obj={id:uid('je'),number:fd.get('number'),date:fd.get('date'),memo:fd.get('memo'),lines,createdAt:now()};if(window.NBADV&&!NBADV.guardFinancialEdit(advancedCtx(),obj))return;if(Math.abs(d-c)>.01){toast('القيد غير متوازن');return}db.journals.push(obj);if(window.NBADV)NBADV.recordChange(advancedCtx(),'Journal',obj.id,null,obj,'إنشاء');audit('إضافة قيد','Journal',fd.get('number'));save('تم حفظ القيد');closeModal();render()}}
function wireReports(){return NBHYPER.wireReports(hyperCtx())}
function wireUsers(){$('#newUser').onclick=()=>openModal('مستخدم جديد',userForm(),false);$$('[data-user]').forEach(b=>b.onclick=()=>openModal('تعديل مستخدم',userForm(b.dataset.user),false));$('#permRole').onchange=e=>$('#permMatrix').innerHTML=permissionMatrix(e.target.value);$('#permMatrix').onchange=e=>{const t=e.target;if(!t.dataset.permM)return;const r=$('#permRole').value;db.permissions[r][t.dataset.permM][t.dataset.permA]=t.checked;audit('تعديل صلاحية','Permissions',`${r} ${t.dataset.permM} ${t.dataset.permA}`);save('تم تحديث الصلاحية')}}
function wireUserForm(){const f=$('#userForm');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),id=f.dataset.id||uid('u'),u={id,name:fd.get('name'),email:fd.get('email'),role:fd.get('role'),active:fd.get('active')==='on',companyIds:[db.session.companyId],branchIds:[db.session.branchId]};const ix=db.users.findIndex(x=>x.id===id);if(ix>=0)db.users[ix]=u;else db.users.push(u);audit(ix>=0?'تعديل مستخدم':'إنشاء مستخدم','User',u.email);save('تم الحفظ');closeModal();render()}}
function wireOrg(){$('#newBranch').onclick=()=>{const n=prompt('اسم الفرع');if(!n)return;db.branches.push({id:uid('br'),companyId:db.session.companyId,name:n,city:prompt('المدينة')||'',active:true});save('تمت إضافة الفرع');render()};$('#newWarehouse').onclick=()=>{const n=prompt('اسم المخزن');if(!n)return;db.warehouses.push({id:uid('wh'),companyId:db.session.companyId,branchId:db.session.branchId,name:n,code:(prompt('الكود')||'WH').toUpperCase(),active:true});save('تمت إضافة المخزن');render()}}
function wireSettings(){$('#settingsForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);db.settings.language=fd.get('language');db.settings.currency=fd.get('currency');company().currency=db.settings.currency;db.settings.invoicePrefix=fd.get('invoicePrefix');db.settings.nextInvoice=Number(fd.get('nextInvoice'));db.settings.preventNegativeStock=fd.get('preventNegativeStock')==='on';db.settings.theme=fd.get('theme')||'light';db.settings.defaultTax=Number(fd.get('defaultTax')||0);db.settings.defaultPaymentTerms=fd.get('defaultPaymentTerms')||'نقدي';db.settings.productImageMaxKB=Number(fd.get('productImageMaxKB')||450);save('تم حفظ الإعدادات');render()};$('#invoiceStyleForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);db.settings.invoiceStyle.title=fd.get('title');db.settings.invoiceStyle.subtitle=fd.get('subtitle')||'';db.settings.invoiceStyle.footer=fd.get('footer')||'';db.settings.invoiceStyle.fontSize=Number(fd.get('fontSize'));db.settings.invoiceStyle.logoSize=Number(fd.get('logoSize'));save('تم حفظ شكل الفاتورة')};const cpf=$('#companyProfileForm');if(cpf)cpf.onsubmit=e=>{e.preventDefault();const fd=new FormData(cpf),co=company();co.name=fd.get('name');co.phone=fd.get('phone');co.email=fd.get('email');co.taxId=fd.get('taxId');co.country=fd.get('country');audit('تحديث هوية الشركة','Company',co.name);save('تم حفظ هوية الشركة');render()};$$('[data-module]').forEach(x=>x.onchange=()=>{db.settings.modules[x.dataset.module]=x.checked;save('تم تحديث الوحدات');render()});$('#showOnboarding').onclick=()=>{db.meta.initialized=false;save();onboarding()};const ia=$('#installApp');if(ia)ia.onclick=async()=>{const p=window.__nbInstallPrompt;if(p){p.prompt();await p.userChoice;window.__nbInstallPrompt=null;toast('تم إرسال طلب التثبيت')}else toast('على iPhone: مشاركة ← إضافة إلى الشاشة الرئيسية')};$('#resetDemo').onclick=()=>{if(confirm('سيتم حذف البيانات الحالية وإعادة النسخة التجريبية. متابعة؟')){localStorage.removeItem(DBKEY);db=load();if(window.NBPRO){NBPRO.migrate(db,moduleKeys);localStorage.setItem(DBKEY,JSON.stringify(db))}render();onboarding()}}}

function wireTrash(){$$('[data-restore]').forEach(b=>b.onclick=()=>{const t=db.trash.find(x=>x.id===b.dataset.restore);if(t?.type==='invoice'){const i=db.invoices.find(x=>x.id===t.entityId);if(i)i.deletedAt=null}db.trash=db.trash.filter(x=>x.id!==b.dataset.restore);save('تمت الاستعادة');render()});$$('[data-purge]').forEach(b=>b.onclick=()=>{if(!confirm('حذف نهائي لا يمكن التراجع عنه؟'))return;const t=db.trash.find(x=>x.id===b.dataset.purge);if(t?.type==='invoice')db.invoices=db.invoices.filter(x=>x.id!==t.entityId);db.trash=db.trash.filter(x=>x.id!==b.dataset.purge);save('تم الحذف النهائي');render()})}
function wireOnboarding(){const f=$('#onboardForm');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);company().name=fd.get('company');company().country=fd.get('country');company().currency=fd.get('currency');db.settings.currency=fd.get('currency');branch().name=fd.get('branch');warehouse().name=fd.get('warehouse');db.settings.nextInvoice=Number(fd.get('nextInvoice'));db.meta.initialized=true;audit('إكمال الإعداد الأول','System',company().name);save();$('#onboarding').innerHTML='';render()};$('#skipOnboarding').onclick=()=>{db.meta.initialized=true;save();$('#onboarding').innerHTML='';render()}}
const oldOpenModal=openModal;openModal=(title,body,wide=true)=>{oldOpenModal(title,body,wide);setTimeout(()=>{if($('#invoiceForm'))wireInvoiceForm();if($('#productForm'))wireProductForm();if($('#contactForm'))wireContactForm();if($('#stockForm'))wireStockForm();if($('#poForm'))wirePOForm();if($('#expenseForm'))wireExpenseForm();if($('#cashForm'))wireCashForm();if($('#journalForm'))wireJournalForm();if($('#userForm'))wireUserForm();if(window.NBPRO)NBPRO.wire(proCtx(),route)},0)};
function purgeExpired(){const cutoff=now()-7*86400000;const expired=db.trash.filter(t=>t.deletedAt<cutoff);expired.forEach(t=>{if(t.type==='invoice')db.invoices=db.invoices.filter(i=>i.id!==t.entityId)});db.trash=db.trash.filter(t=>t.deletedAt>=cutoff);if(expired.length)save()}
purgeExpired();if(window.NBADV)NBADV.initGlobal(advancedCtx());if(window.NBUX){NBUX.migrate(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}if(window.NBRELEASE){NBRELEASE.init(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}if(window.NBSAAS){NBSAAS.init(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}if(window.NBACT){NBACT.migrate(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}if(window.NBREL){NBREL.initGlobal(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}if(window.NBMOBILE){NBMOBILE.initGlobal(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}if(window.NBRC){NBRC.migrate(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}if(window.NBFINALUX){NBFINALUX.migrate(advancedCtx());localStorage.setItem(DBKEY,JSON.stringify(db))}render();onboarding();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>{if(window.NBMOBILE)NBMOBILE.registerSW(advancedCtx(),reg)}).catch(()=>{}))}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__nbInstallPrompt=e;if(window.NBMOBILE)NBMOBILE.setInstallPrompt(e)});
})();
