function migrateOld(s){try{const old=JSON.parse(localStorage.getItem(OLDKEY));if(!old)return;const comp=s.companies[0].id,br=s.branches[0].id,wh=s.warehouses[0].id;if(Array.isArray(old.products)&&old.products.length){old.products.forEach((p,idx)=>s.products.push({id:'oldp-'+(p.id||idx),companyId:comp,nameAr:p.name||'منتج',nameEn:'',sku:'OLD-'+String(idx+1).padStart(3,'0'),barcode:'',categoryId:'',unit:'قطعة',cost:0,price:Number(p.price||0),tax:0,trackStock:true,reorder:0,supplierId:'',active:true}));old.products.forEach((p,idx)=>{if(Number(p.stock||0))s.stockMoves.push({id:uid('osm'),companyId:comp,warehouseId:wh,productId:'oldp-'+(p.id||idx),type:'receipt',qty:Number(p.stock||0),date:today(),ref:'IHOMA-MIGRATION',note:'مرحل من iHoma Invoices'})})}if(Array.isArray(old.invoices)){old.invoices.forEach((i,idx)=>{let cid='';if(i.customerName){cid=uid('oc');s.customers.push({id:cid,companyId:comp,name:i.customerName,phone:i.phone||'',email:'',address:[i.governorate,i.address].filter(Boolean).join(' - '),taxId:'',notes:'مرحل من iHoma',createdAt:now()})}s.invoices.push({id:'oldi-'+(i.id||idx),companyId:comp,branchId:br,warehouseId:wh,number:i.number||('IH-'+idx),date:i.date||today(),customerId:cid,status:(i.status==='ملغي'?'cancelled':i.status==='مرتجع'?'returned':i.status==='مكتملة'||i.status==='تم التسليم'?'paid':'draft'),items:(i.items||[]).map(x=>({productId:'',name:x.name||'منتج',qty:Number(x.qty||1),price:Number(x.price||0),discount:0,tax:0})),shipping:Number(i.delivery||0),discount:Number(i.discountValue||0),notes:i.notes||'',payments:[],createdAt:i.createdAt||now(),deletedAt:null})})}s.meta.migratedOld=true}catch(e){}}
let db=load(), route='dashboard', state={editingInvoice:null,posCart:[],search:'',reportFrom:'',reportTo:''};

function audit(action,entity,detail=''){db.audit.unshift({id:uid('au'),userId:db.session.userId,action,entity,detail,createdAt:now()});db.audit=db.audit.slice(0,500)}
function company(){return db.companies.find(x=>x.id===db.session.companyId)||db.companies[0]}
function branch(){return db.branches.find(x=>x.id===db.session.branchId)||db.branches[0]}
function warehouse(){return db.warehouses.find(x=>x.companyId===db.session.companyId&&x.branchId===db.session.branchId)||db.warehouses.find(x=>x.companyId===db.session.companyId)}
function currentUser(){return db.users.find(x=>x.id===db.session.userId)||db.users[0]}
function stock(productId,warehouseId=warehouse()?.id){return db.stockMoves.filter(m=>m.companyId===db.session.companyId&&m.productId===productId&&(!warehouseId||m.warehouseId===warehouseId)).reduce((s,m)=>s+(m.type==='delivery'||m.type==='out'||m.type==='return_supplier'?-Number(m.qty||0):Number(m.qty||0)),0)}
function invTotals(i){const sub=(i.items||[]).reduce((s,x)=>s+Number(x.qty||0)*Number(x.price||0)*(1-Number(x.discount||0)/100)*(1+Number(x.tax||0)/100),0);const total=Math.max(0,sub+Number(i.shipping||0)-Number(i.discount||0));const paid=(i.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);return{sub,total,paid,due:Math.max(0,total-paid)}}
function statusBadge(s){const map={draft:['مسودة','gray'],confirmed:['مؤكدة','purple'],partial:['مدفوعة جزئياً','amber'],paid:['مدفوعة','green'],cancelled:['ملغاة','red'],returned:['مرتجعة','red'],approved:['معتمدة','green'],sent:['مرسلة','purple'],received:['مستلمة','green'],closed:['مغلقة','gray'],pending:['بانتظار','amber']};const a=map[s]||[s,'gray'];return `<span class="badge ${a[1]}">${a[0]}</span>`}

function sidebar(){const L=labels[db.settings.language]||labels.ar;let h=`<div class="brand"><div class="mark">N</div><div><h1>NovaBlu ERP</h1><small>V1.2 Pro Preview</small></div></div>`;navSections().forEach(([g,items])=>{h+=`<div class="nav-group"><div class="nav-label">${g}</div>`;items.forEach(k=>{if(k!=='dashboard'&&db.settings.modules[k]===false)return;h+=`<button class="nav-btn ${route===k?'active':''}" data-route="${k}"><span class="ico">${icons[k]}</span>${L[k]}</button>`});h+='</div>'});h+=`<div class="sidebar-foot">${esc(company()?.name||'')}<br>${esc(currentUser()?.name||'')} • ${esc(currentUser()?.role||'')}</div>`;return h}

function viewDashboard(){const inv=db.invoices.filter(i=>i.companyId===db.session.companyId&&!i.deletedAt&&!['cancelled','returned'].includes(i.status));const sales=inv.reduce((s,i)=>s+invTotals(i).total,0),due=inv.reduce((s,i)=>s+invTotals(i).due,0),exp=db.expenses.filter(e=>e.companyId===db.session.companyId&&e.status==='paid').reduce((s,e)=>s+Number(e.amount||0),0);const low=db.products.filter(p=>p.companyId===db.session.companyId&&p.trackStock&&stock(p.id)<=Number(p.reorder||0));const months=[];for(let k=5;k>=0;k--){let dt=new Date();dt.setMonth(dt.getMonth()-k);let key=dt.toISOString().slice(0,7);let val=inv.filter(i=>(i.date||'').startsWith(key)).reduce((s,i)=>s+invTotals(i).total,0);months.push({key,label:dt.toLocaleDateString('ar-IQ',{month:'short'}),val})}const max=Math.max(...months.map(x=>x.val),1);return pageHead('لوحة التحكم',`${company().name} • ${branch()?.name||''}`,`<button class="btn primary" data-q="invoice">＋ فاتورة</button>`)+`<div class="grid kpis"><div class="kpi"><div class="bubble">↗</div><div class="lab">إجمالي المبيعات</div><div class="val">${fmt(sales)}</div><div class="trend" style="color:var(--green)">من ${inv.length} فاتورة فعّالة</div></div><div class="kpi"><div class="bubble">🧾</div><div class="lab">الفواتير</div><div class="val">${inv.length}</div><div class="trend">${inv.filter(i=>invTotals(i).due>0).length} تحتاج متابعة</div></div><div class="kpi"><div class="bubble">↘</div><div class="lab">المصروفات المدفوعة</div><div class="val">${fmt(exp)}</div><div class="trend">تشغيلي</div></div><div class="kpi"><div class="bubble">!</div><div class="lab">مستحقات العملاء</div><div class="val">${fmt(due)}</div><div class="trend" style="color:var(--amber)">${low.length} تنبيه مخزون</div></div></div><div class="grid cards2"><div class="card"><div class="card-head"><h3>المبيعات — آخر 6 أشهر</h3><div class="grow"></div></div><div class="bar-chart">${months.map(x=>`<div class="bar-col"><div class="bar" style="height:${Math.max(8,x.val/max*180)}px" function invoiceMini(arr){return arr.length?`<div class="stat-list">${arr.map(i=>{const c=db.customers.find(c=>c.id===i.customerId);return `<div class="stat-row"><div class="grow"><strong>${esc(i.number)}</strong><div class="sub">${esc(c?.name||'عميل نقدي')} • ${i.date}</div></div><strong>${fmt(invTotals(i).total)}</strong>${statusBadge(i.status)}</div>`}).join('')}</div>`:'<div class="empty">لا توجد فواتير</div>'}
function viewSales(){const arr=db.invoices.filter(i=>i.companyId===db.session.companyId&&!i.deletedAt).sort((a,b)=>b.createdAt-a.createdAt);return pageHead('المبيعات والفواتير',`${arr.length} مستند`,`<button class="btn primary" data-q="invoice">＋ فاتورة جديدة</button>`)+`<div class="toolbar"><input id="salesSearch" placeholder="ابحث برقم الفاتورة أو العميل..."><select id="salesStatus"><option value="">كل الحالات</option><option value="draft">مسودة</option><option value="confirmed">مؤكدة</option><option value="partial">مدفوعة جزئياً</option><option value="paid">مدفوعة</option><option value="cancelled">ملغاة</option></select><button class="btn outline" id="exportSales">تصدير CSV</button></div><div class="card responsive-table"><div class="table-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="salesBody">${salesRows(arr)}</tbody></table></div></div>`}

function invoiceForm(id){const w=warehouse(),existing=id?db.invoices.find(x=>x.id===id):null;const i=existing?clone(existing):{id:'',companyId:db.session.companyId,branchId:db.session.branchId,warehouseId:w?.id||'',number:`${db.settings.invoicePrefix}-${db.settings.nextInvoice}`,date:today(),customerId:'',status:'draft',items:[{productId:'',name:'',qty:1,price:0,discount:0,tax:0}],shipping:0,discount:0,notes:'',payments:[],createdAt:now(),deletedAt:null};const t=invTotals(i);return `<form id="invoiceForm" data-id="${i.id||''}"><div class="form-grid"><div class="field"><label>رقم الفاتورة</label><input name="number" value="${esc(i.number)}" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${i.date}" required></div><div class="field"><label>العميل</label><select name="customerId"><option value="">عميل نقدي</option>${db.customers.filter(c=>c.companyId===db.session.companyId).map(c=>`<option value="${c.id}" ${c.id===i.customerId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>الحالة</label><select name="status">${['draft','confirmed','partial','paid','cancelled','returned'].map(s=>`<option value="${s}" ${s===i.status?'selected':''}>${statusBadge(s).replace(/<[^>]+>/g,'')}</option>`).join('')}</select></div></div><div class="card" style="box-shadow:none;margin-top:14px"><div class="card-head"><h3>الأصناف</h3><div class="grow"></div><button type="button" class="btn sm" id="addInvLine">＋ سطر</button></div><div class="table-wrap"><table class="invoice-lines"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>خصم %</th><th>ضريبة %</th><th></th></tr></thead><tbody id="invLines">${i.items.map((x,n)=>invLine(x,n)).join('')}</tbody></table></div></div><div class="form-grid"><div class="field"><label>خصم مباشر</label><input name="discount" type="number" min="0" value="${i.discount||0}"></div><div class="field"><label>الشحن</label><input name="shipping" type="number" min="0" value="${i. function viewPurchasing(){const arr=db.purchaseOrders.filter(p=>p.companyId===db.session.companyId).sort((a,b)=>b.createdAt-a.createdAt);return pageHead('المشتريات',`${arr.length} أمر شراء`,`<button class="btn primary" data-q="purchase">＋ أمر شراء</button>`)+`<div class="card responsive-table"><div class="table-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>المورد</th><th>القيمة</th><th>الحالة</th><th>الاستلام</th><th>إجراء</th></tr></thead><tbody>${arr.map(p=>{const s=db.suppliers.find(x=>x.id===p.supplierId),total=p.items.reduce((a,x)=>a+x.qty*x.cost,0),qty=p.items.reduce((a,x)=>a+x.qty,0);return `<tr><td data-label="الرقم"><strong>${p.number}</strong></td><td data-label="التاريخ">${p.date}</td><td data-label="المورد">${esc(s?.name||'')}</td><td data-label="القيمة">${fmt(total)}</td><td data-label="الحالة">${statusBadge(p.status)}</td><td data-label="الاستلام">${p.receivedQty||0}/${qty}</td><td data-label="إجراء"><button class="btn sm" data-po="${p.id}">فتح</button></td></tr>`}).join('')}</tbody></table></div></div>`}

function viewReports(){const inv=db.invoices.filter(i=>!i.deletedAt&&!['cancelled','returned'].includes(i.status)),sales=inv.reduce((s,i)=>s+invTotals(i).total,0),exp=db.expenses.filter(e=>e.status==='paid').reduce((s,e)=>s+e.amount,0),cost=inv.reduce((s,i)=>s+i.items.reduce((z,x)=>{const p=db.products.find(p=>p.id===x.productId);return z+(p?.cost||0)*x.qty},0),0),profit=sales-cost-exp;return pageHead('التقارير','تحليل فوري للبيانات',`<button class="btn outline" id="exportAllReports">تصدير ملخص CSV</button>`)+`<div class="grid kpis"><div class="kpi"><div class="lab">المبيعات</div><div class="val">${fmt(sales)}</div></div><div class="kpi"><div class="lab">تكلفة البضاعة</div><div class="val">${fmt(cost)}</div></div><div class="kpi"><div class="lab">المصروفات</div><div class="val">${fmt(exp)}</div></div><div class="kpi"><div class="lab">تقدير الربح</div><div class="val" style="color:${profit>=0?'var(--green)':'var(--red)'}">${fmt(profit)}</div></div></div><div class="grid cards2"><div class="card"><div class="card-head"><h3>أعلى المنتجات مبيعاً</h3></div>${topProducts(inv)}</div><div class="card"><div class="card-head"><h3>أعلى العملاء</h3></div>${topCustomers(inv)}</div></div><div class="card responsive-table"><div class="card-head"><h3>ذمم العملاء</h3></div><div class="table-wrap"><table><thead><tr><th>العميل</th><th>إجمالي الفواتير</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody>${db.customers.map(c=>{const x=inv.filter(i=>i.customerId===c.id),t=x.reduce((s,i)=>s+invTotals(i).total,0),p=x.reduce((s,i)=>s+invTotals(i).paid,0);return `<tr><td data-label="العميل">${esc(c.name)}</td><td data-label="الإجمالي">${fmt(t)}</td><td data-label="المدفوع">${fmt(p)}</td><td data-label="المتبقي"><strong>${fmt(t-p)}</strong></td></tr>`}).join('')}</tbody></table></div></div>`}
function topProducts(inv){const m={};inv.forEach(i=>i.items.forEach(x=>{const k=x.productId||x.name;m[k]=(m[k]||0)+x.qty*x.price}));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v],n)=>{const p=db.products.find(x=>x.id===k),pct=Math.min(100,v/Math.max(...Object.values(m),1)*100);return `<div class="stat-row"><span>${n+1}</span><div class="grow"><strong>${esc(p?.nameAr||k)}</strong><div class="progress"><i style="width:${pct}%"></i></div></div><strong>${fmt(v)}</strong></div>`}).join('')||'<div class="empty">لا توجد بيانات</div>'}
function topCustomers(inv){return db.customers.map(c=>({c,val:inv.filter(i=>i.customerId===c.id).reduce((s,i)=>s+invTotals(i).total,0)})).sort((a,b)=>b.val-a.val).slice(0,8).map((x,n)=>`<div class="stat-row"><span>${n+1}</span><div class="grow"><strong>${esc(x.c.name)}</strong><div class="sub">${esc(x.c.phone||'')}</div></div><strong>${fmt(x.val)}</strong></div>`).join('')}

function viewSettings(){return pageHead('الإعدادات','تهيئة النظام')+`<div class="grid cards2"><div class="card"><div class="card-head"><h3>الإعدادات العامة</h3></div><form id="settingsForm"><div class="form-grid"><div class="field"><label>اللغة</label><select name="language"><option value="ar" ${db.settings.language==='ar'?'selected':''}>العربية</option><option value="en" ${db.settings.language==='en'?'selected':''}>English</option></select></div><div class="field"><label>العملة الأساسية</label><select name="currency">${['IQD','USD','SAR','AED','KWD','QAR','JOD','EUR','GBP'].map(c=>`<option ${c===db.settings.currency?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>بادئة الفواتير</label><input name="invoicePrefix" value="${esc(db.settings.invoicePrefix)}"></div><div class="field"><label>رقم الفاتورة التالي</label><input name="nextInvoice" type="number" value="${db.settings.nextInvoice}"></div><div class="field"><label class="switch"><input name="preventNegativeStock" type="checkbox" ${db.settings.preventNegativeStock?'checked':''}> منع المخزون السالب</label></div></div><button class="btn primary" style="margin-top:12px">حفظ الإعدادات</button></form></div><div class="card"><div class="card-head"><h3>شكل الفاتورة</h3></div><form id="invoiceStyleForm"><div class="form-grid"><div class="field"><label>عنوان الفاتورة</label><input name="title" value="${esc(db.settings.invoiceStyle.title)}"></div><div class="field"><label>حجم الخط</label><input name="fontSize" type="number" min="10" max="20" value="${db.settings.invoiceStyle.fontSize}"></div><div class="field"><label>حجم الشعار</label><input name="logoSize" type="number" min="36" max="120" value="${db.settings.invoiceStyle.logoSize}"></div></div><button class="btn primary" style="margin-top:12px">حفظ الشكل</button></form></div></div><div class="card"><div class="card-head"><h3>الوحدات</h3><div class="sub">تشغيل أو إيقاف الوحدات حسب حاجة الشركة</div></div><div class="module-grid">${moduleKeys function printInvoiceDoc(i){const c=db.customers.find(x=>x.id===i.customerId),t=invTotals(i),co=company();const w=window.open('','_blank');w.document.write(`<!doctype html><html dir="rtl"><head><meta charset="utf-8"><title>${i.number}</title><style>body{font-family:Arial;padding:30px;color:#111}.head{display:flex;justify-content:space-between;border-bottom:3px solid #2563eb;padding-bottom:15px}.logo{width:${db.settings.invoiceStyle.logoSize}px;height:${db.settings.invoiceStyle.logoSize}px;border-radius:18px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{border:1px solid #ddd;padding:9px;text-align:right}th{background:#f3f4f6}.total{font-size:20px;font-weight:bold;text-align:left}</style></head><body style="font-size:${db.settings.invoiceStyle.fontSize}px"><div class="head"><div><h1>${esc(db.settings.invoiceStyle.title)}</h1><b>${esc(co.name)}</b><div>${esc(co.phone||'')} • ${esc(co.email||'')}</div></div><div class="logo">N</div></div><p><b>رقم الفاتورة:</b> ${esc(i.number)} &nbsp; <b>التاريخ:</b> ${i.date}</p><p><b>العميل:</b> ${esc(c?.name||'عميل نقدي')} ${c?.phone?'• '+esc(c.phone):''}</p><table><thead><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${i.items.map((x,n)=>`<tr><td>${n+1}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${fmt(x.price)}</td><td>${fmt(x.qty*x.price)}</td></tr>`).join('')}</tbody></table><div class="total">الإجمالي: ${fmt(t.total)}<br>المدفوع: ${fmt(t.paid)}<br>المتبقي: ${fmt(t.due)}</div><p>${esc(i.notes||'')}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function csv(name,rows){const text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
